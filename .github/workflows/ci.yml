name: SecSentinel DevSecOps CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  security-and-quality-gate:
    name: "Quality & Security Gate (Ruff + Bandit + MyPy + Pytest >= 85%)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ENVIRONMENT: testing
      DEBUG: "false"
      JWT_SECRET_KEY: "ci_pipeline_ephemeral_test_secret_with_at_least_32_bytes!"
      POSTGRES_USER: secsentinel_ci
      POSTGRES_PASSWORD: secsentinel_ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: secsentinel_test
      REDIS_URL: "redis://localhost:6379/0"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies (Editable + Dev Suite)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter & Bandit Security Rules (S)
        run: ruff check .

      - name: Run MyPy Strict Static Type Checking
        run: mypy src

      - name: Run Automated Security & Unit Tests with Coverage Gate (>= 85%)
        run: pytest -v --cov=secsentinel --cov-report=term-missing --cov-fail-under=85
