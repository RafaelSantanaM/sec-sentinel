apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secsentinel-api-hpa
  namespace: secsentinel
  labels:
    app.kubernetes.io/name: secsentinel
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: secsentinel-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: secsentinel-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      # Janela de estabilização conservadora de 5 minutos para evitar "Flapping" (oscilação)
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
