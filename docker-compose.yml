services:
  db:
    image: postgres:16-alpine
    container_name: secsentinel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secsentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_strong_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-secsentinel_db}
    ports:
      # DEFESA EM PROFUNDIDADE: Expõe apenas para o loopback local (127.0.0.1), nunca 0.0.0.0
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secsentinel_user} -d ${POSTGRES_DB:-secsentinel_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend-net

  redis:
    image: redis:7-alpine
    container_name: secsentinel-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend-net

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    image: secsentinel-app:latest
    container_name: secsentinel-migrations
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: secsentinel-app:latest
    container_name: secsentinel-api
    restart: unless-stopped
    command: ["uvicorn", "secsentinel.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: secsentinel-app:latest
    container_name: secsentinel-worker
    restart: unless-stopped
    command: ["celery", "-A", "secsentinel.worker.celery_app:celery_app", "worker", "--loglevel=info"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "celery", "-A", "secsentinel.worker.celery_app:celery_app", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend-net

volumes:
  pgdata:
  redisdata:

networks:
  backend-net:
    driver: bridge
